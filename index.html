<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>База знаний — Подрядчикам</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e7ebf0;--accent:#2563eb;--accent2:#1d4ed8;--shadow:0 12px 35px rgba(20,35,55,.08)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#111827,#263449);color:white;padding:28px 5vw 34px}
.top{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:46px;height:46px;border-radius:13px;background:#fff;color:#1d4ed8;display:grid;place-items:center;font-weight:800;font-size:20px}
h1{font-size:25px;margin:0 0 3px}
.sub{color:#cbd5e1;font-size:14px}
.hero{max-width:1280px;margin:26px auto 0}
.hero h2{font-size:34px;margin:0 0 9px}
.hero p{margin:0;color:#cbd5e1}
main{max-width:1280px;margin:0 auto;padding:28px 5vw 60px}
.search{background:var(--card);padding:16px;border-radius:16px;box-shadow:var(--shadow);display:flex;gap:10px}
.search input{flex:1;border:1px solid var(--line);padding:13px 14px;border-radius:10px;font-size:15px;outline:none}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;font-family:inherit}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2f7;color:#17202a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:0 6px 24px rgba(20,35,55,.04);transition:.18s;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.icon{font-size:28px}
.card h3{margin:11px 0 6px}
.muted{color:var(--muted);font-size:14px}
.section{margin-top:34px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}
.section-title h2{margin:0;font-size:21px}
.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cfd6df;border-radius:14px}

/* модалка */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.show{display:flex}
.modal-box{width:min(760px,100%);background:#fff;border-radius:18px;padding:24px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-box h2{margin:0 0 4px}
.modal-box .modal-sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-shrink:0}

.modal-search{display:flex;gap:8px;margin-bottom:14px;flex-shrink:0}
.modal-search input{flex:1;border:1px solid var(--line);padding:10px 12px;border-radius:10px;font-size:14px;outline:none;margin:0}

/* вкладки внутри модалки */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-shrink:0;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.18s}
.tab:hover{background:#f1f5f9;color:var(--text)}
.tab.active{background:var(--accent);color:#fff}

.file-list{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:6px;
  margin-right:-6px;
  -webkit-overflow-scrolling:touch;
  min-height:0;
  max-height:100%;
}
.file-list::-webkit-scrollbar{width:10px}
.file-list::-webkit-scrollbar-track{background:#f1f5f9;border-radius:8px}
.file-list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
.file-list::-webkit-scrollbar-thumb:hover{background:#94a3b8}

.file-item{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.15s;background:#fff}
.file-item:hover{border-color:var(--accent);background:#f8faff;transform:translateX(2px)}
.file-item .fi-icon{width:42px;height:42px;border-radius:10px;background:#eef2ff;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.file-item .fi-main{flex:1;min-width:0}
.file-item .fi-name{font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .fi-desc{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .fi-size{color:var(--muted);font-size:12px;white-space:nowrap;flex-shrink:0}
.file-item .fi-dl{background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap;flex-shrink:0}

/* карточки видео */
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.video-card{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:inherit;transition:.15s;cursor:pointer}
.video-card:hover{border-color:var(--accent);background:#f8faff;transform:translateX(2px)}
.video-card .v-icon{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#1d4ed8);display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:20px;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.video-card .v-icon:after{content:"↗";font-weight:800;font-size:22px;line-height:1}
.video-card .v-main{flex:1;min-width:0}
.video-card .v-name{font-weight:700;font-size:13px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-card .v-desc{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-card .v-meta{display:flex;gap:6px;margin-top:5px;font-size:11px;color:#94a3b8}
.video-card .v-dur{background:#eef2ff;color:#1d4ed8;padding:2px 7px;border-radius:5px;font-weight:700}
.video-card .v-proj{background:#f1f5f9;color:#475569;padding:2px 7px;border-radius:5px;font-weight:700}

.status{font-size:12px;color:#cbd5e1;margin-top:10px}
.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:white;padding:13px 16px;border-radius:11px;display:none;z-index:60;max-width:340px}
.toast b{display:block;margin-bottom:4px}

.errbox{max-width:1280px;margin:20px auto;padding:16px 20px;background:#fee2e2;border:1px solid #fecaca;color:#7f1d1d;border-radius:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap}

@media(max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:800px){
  .grid{grid-template-columns:1fr}
  .top{align-items:flex-start;flex-direction:column}
  .hero h2{font-size:27px}
  .file-item .fi-size{display:none}
  .videos{grid-template-columns:1fr}
}
</style>
</head>

<header>
  <div class="top">
    <div class="brand">
      <div class="logo">П</div>
      <div>
        <h1 id="companyName">Проектный отдел</h1>
        <div class="sub" id="subtitle">Материалы по проектам — для подрядчиков</div>
      </div>
    </div>
  </div>
  <div class="hero">
    <h2>Материалы по проектам</h2>
    <p>Кликните проект — откроется список файлов и видеоинструкций. Клик по файлу — скачивание, клик по видео — просмотр на Яндекс.Диске.</p>
    <div class="status" id="status"></div>
  </div>
</header>
<main>
  <div id="errbox"></div>

  <div class="search">

    <button class="btn primary" id="btnClear">Очистить</button>
  </div>

  <section class="section" id="searchSection" style="display:none">
    <div class="section-title">
      <h2>Результаты поиска</h2>
      <span class="muted" id="searchCount"></span>
    </div>
    <div class="file-list" id="searchFiles" style="max-height:none"></div>
    <div class="videos" id="searchVideos" style="margin-top:12px"></div>
  </section>

  <div id="normalView">
    <div class="grid" id="categories"></div>

    <section class="section">
      <div class="section-title">
        <h2>Видеоинструкции</h2>
        <span class="muted">Открываются на Яндекс.Диске</span>
      </div>
      <div class="videos" id="allVideos"></div>
    </section>
  </div>
</main>

<div class="modal" id="filesModal">
  <div class="modal-box">
    <h2 id="fmTitle">Файлы</h2>
    <div class="modal-sub" id="fmSub"></div>
    <div class="tabs" id="fmTabs" style="display:none">
      <button class="tab active" data-tab="files" type="button">📄 Файлы</button>
      <button class="tab" data-tab="videos" type="button">🎬 Видео</button>
    </div>
    <div class="modal-search">
      <input id="fmSearch" placeholder="Быстрый поиск по названию…">
    </div>
    <div class="file-list" id="fmList"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="fmClose">Закрыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ============================================================
   УТИЛИТЫ
   ============================================================ */

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function plural(n, forms){
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b > 1 && b < 5)   return forms[1];
  if (b === 1)          return forms[0];
  return forms[2];
}

function fileIcon(name){
  const n = String(name || "").toLowerCase();
  if (n.endsWith(".pdf")) return "📕";
  if (n.endsWith(".zip") || n.endsWith(".rar") || n.endsWith(".7z")) return "🗜️";
  if (n.endsWith(".exe") || n.endsWith(".msi")) return "⚙️";
  if (n.endsWith(".bin") || n.endsWith(".fw"))  return "💾";
  if (n.endsWith(".doc") || n.endsWith(".docx"))return "📘";
  if (n.endsWith(".xls") || n.endsWith(".xlsx"))return "📊";
  if (n.endsWith(".ppt") || n.endsWith(".pptx"))return "📽️";
  if (n.endsWith(".txt")) return "📝";
  if (n.endsWith(".png") || n.endsWith(".jpg") || n.endsWith(".jpeg")) return "🖼️";
  return "📄";
}

const $ = id => document.getElementById(id);
const els = {
  categories: $("categories"),
  status:     $("status"),
  search:     $("search"),
  fmTitle:    $("fmTitle"),
  fmSub:      $("fmSub"),
  fmSearch:   $("fmSearch"),
  fmList:     $("fmList"),
  fmTabs:     $("fmTabs"),
  filesModal: $("filesModal"),
  toast:      $("toast"),
  errbox:     $("errbox")
};

function catById(id){ return CATEGORIES.find(c => c.id === id); }

/* ---------- карточка файла ---------- */
function buildFileItem(f){
  const item = document.createElement("div");
  item.className = "file-item";
  item.setAttribute("data-url", f.url || "");
  item.setAttribute("data-name", f.name || "");
  item.innerHTML =
    '<div class="fi-icon">' + esc(fileIcon(f.name)) + '</div>' +
    '<div class="fi-main">' +
      '<div class="fi-name">' + esc(f.name) + '</div>' +
      '<div class="fi-desc">' + esc(f.description || "") + '</div>' +
    '</div>' +
    '<div class="fi-size">' + esc(f.size || "") +
      (f.updated ? " • " + esc(f.updated) : "") + '</div>' +
    '<div class="fi-dl">⬇ Скачать</div>';
  return item;
}

/* ---------- карточка видео ---------- */
function buildVideoCard(v){
  const a = document.createElement("a");
  a.className = "video-card";
  a.href = v.url;
  a.target = "_blank";
  a.rel = "noopener";
  const cat = catById(v.project);
  const meta = [];
  if (v.duration) meta.push('<span class="v-dur">' + esc(v.duration) + '</span>');
  if (cat) meta.push('<span class="v-proj">' + esc(cat.icon + " " + cat.title) + '</span>');
  a.innerHTML =
    '<div class="v-icon"></div>' +
    '<div class="v-main">' +
      '<div class="v-name">' + esc(v.name) + '</div>' +
      (v.description ? '<div class="v-desc">' + esc(v.description) + '</div>' : '') +
      (meta.length ? '<div class="v-meta">' + meta.join("") + '</div>' : '') +
    '</div>';
  return a;
}

/* ---------- рендер главной ---------- */
function renderCategories(){
  els.categories.innerHTML = "";
  const frag = document.createDocumentFragment();
  CATEGORIES.forEach(c => {
    const fc = FILES.filter(f => f.project === c.id).length;
    const vc = VIDEOS.filter(v => v.project === c.id).length;
    const parts = [];
    if (fc) parts.push(fc + " " + plural(fc, ["файл","файла","файлов"]));
    if (vc) parts.push(vc + " " + plural(vc, ["видео","видео","видео"]));
    const card = document.createElement("div");
    card.className = "card";
    card.setAttribute("data-cat", c.id);
    card.innerHTML =
      '<div class="icon">' + esc(c.icon) + '</div>' +
      '<h3>' + esc(c.title) + '</h3>' +
      '<div class="muted">' + (parts.length ? esc(parts.join(" · ")) : "Материалов нет") + '</div>';
    frag.appendChild(card);
  });
  els.categories.appendChild(frag);
}

function renderAllVideos(){
  const box = $("allVideos");
  box.innerHTML = "";
  if (!VIDEOS.length){
    box.innerHTML = '<div class="empty">Видео пока нет</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  VIDEOS.forEach(v => frag.appendChild(buildVideoCard(v)));
  box.appendChild(frag);
}

function renderStatus(){
  els.status.textContent = "Проектов: " + CATEGORIES.length + " • файлов: " + FILES.length + " • видео: " + VIDEOS.length;
}

function render(){
  renderCategories();
  renderAllVideos();
  renderStatus();
}

/* ---------- поиск ---------- */
function renderSearchResults(){
  const q = els.search.value.toLowerCase().trim();
  const searchSection = document.getElementById("searchSection");
  const normalView    = document.getElementById("normalView");
  const searchFiles   = document.getElementById("searchFiles");
  const searchVideos  = document.getElementById("searchVideos");
  const searchCount   = document.getElementById("searchCount");

  if (!q){
    searchSection.style.display = "none";
    normalView.style.display = "";
    return;
  }

  searchSection.style.display = "";
  normalView.style.display = "none";

  const files = FILES.filter(f => {
    const cat = catById(f.project);
    const projectTitle = cat ? cat.title : "";
    const text = (
      (f.name || "") + " " +
      (f.description || "") + " " +
      (f.size || "") + " " +
      (f.updated || "") + " " +
      projectTitle
    ).toLowerCase();
    return text.includes(q);
  });

  const videos = VIDEOS.filter(v => {
    const cat = catById(v.project);
    const projectTitle = cat ? cat.title : "";
    const text = (
      (v.name || "") + " " +
      (v.description || "") + " " +
      (v.duration || "") + " " +
      projectTitle
    ).toLowerCase();
    return text.includes(q);
  });

  const total = files.length + videos.length;
  searchCount.textContent = total
    ? "Найдено: " + total + " (" + files.length + " файлов, " + videos.length + " видео)"
    : "Ничего не найдено";

  searchFiles.innerHTML = "";
  searchVideos.innerHTML = "";

  if (files.length){
    const frag = document.createDocumentFragment();
    files.forEach(f => frag.appendChild(buildFileItem(f)));
    searchFiles.appendChild(frag);
  }

  if (videos.length){
    const frag = document.createDocumentFragment();
    videos.forEach(v => frag.appendChild(buildVideoCard(v)));
    searchVideos.appendChild(frag);
  }

  if (!files.length && !videos.length){
    searchFiles.innerHTML = '<div class="empty">По запросу «' + esc(q) + '» ничего не найдено</div>';
  }
}

/* ---------- модалка проекта ---------- */
let currentCategory = null;
let currentTab = "files";

function openFilesModal(categoryId){
  currentCategory = categoryId;
  currentTab = "files";
  const cat = catById(categoryId);
  els.fmTitle.textContent = (cat ? cat.icon + " " + cat.title : "Файлы");

  const fc = FILES.filter(f => f.project === categoryId).length;
  const vc = VIDEOS.filter(v => v.project === categoryId).length;
  const parts = [];
  if (fc) parts.push(fc + " " + plural(fc, ["файл","файла","файлов"]));
  if (vc) parts.push(vc + " " + plural(vc, ["видео","видео","видео"]));
  els.fmSub.textContent = parts.join(" · ");

  /* Показываем вкладки, только если у проекта есть и файлы, и видео */
  if (fc && vc){
    els.fmTabs.style.display = "";
    els.fmTabs.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    els.fmTabs.querySelector('.tab[data-tab="files"]').classList.add("active");
  } else {
    els.fmTabs.style.display = "none";
    /* Если только видео — сразу открываем вкладку видео */
    if (!fc && vc) currentTab = "videos";
  }

  els.fmSearch.value = "";
  renderFilesModal();
  els.filesModal.classList.add("show");
  setTimeout(() => els.fmSearch.focus(), 30);
}

function closeFilesModal(){
  els.filesModal.classList.remove("show");
  currentCategory = null;
}

function renderFilesModal(){
  if (!currentCategory) return;
  const q = els.fmSearch.value.toLowerCase().trim();

  if (currentTab === "videos"){
    const list = VIDEOS.filter(v =>
      v.project === currentCategory &&
      (!q || (v.name + " " + (v.description || "")).toLowerCase().includes(q))
    );
    els.fmList.innerHTML = "";
    if (!list.length){
      els.fmList.innerHTML = '<div class="empty">Видео не найдено</div>';
      return;
    }
    const wrap = document.createElement("div");
    wrap.className = "videos";
    list.forEach(v => wrap.appendChild(buildVideoCard(v)));
    els.fmList.appendChild(wrap);
    return;
  }

  const list = FILES.filter(f =>
    f.project === currentCategory &&
    (!q || (f.name + " " + (f.description || "")).toLowerCase().includes(q))
  );
  els.fmList.innerHTML = "";
  if (!list.length){
    els.fmList.innerHTML = '<div class="empty">Файлов не найдено</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  list.forEach(f => frag.appendChild(buildFileItem(f)));
  els.fmList.appendChild(frag);
}

/* ---------- переключение вкладок ---------- */
els.fmTabs.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  currentTab = tab.getAttribute("data-tab");
  els.fmTabs.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  els.fmSearch.value = "";
  renderFilesModal();
});

/* ---------- скачивание ---------- */
function downloadFile(url, name){
  if (!url){
    toast("Ссылка на файл не указана");
    return;
  }
  toast("Скачивание началось\n" + name);
  const a = document.createElement("a");
  a.href = url;
  a.rel = "noopener";
  a.target = "_blank";
  try {
    if (url.startsWith(location.origin) || url.startsWith("file:")) {
      a.download = name;
    }
  } catch(e){ /* ignore */ }
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ---------- делегирование ---------- */
document.addEventListener("click", e => {
  const card = e.target.closest(".card[data-cat]");
  if (card) { openFilesModal(card.getAttribute("data-cat")); return; }

  const item = e.target.closest(".file-item");
  if (item){
    downloadFile(item.getAttribute("data-url"), item.getAttribute("data-name"));
    return;
  }

  if (e.target.id === "fmClose")  { closeFilesModal(); return; }
  if (e.target.id === "btnClear") { clearSearch(); return; }

  if (e.target.classList && e.target.classList.contains("modal")) {
    e.target.classList.remove("show");
    if (e.target.id === "filesModal") currentCategory = null;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    document.querySelectorAll(".modal.show").forEach(m => m.classList.remove("show"));
    currentCategory = null;
  }
});

els.search.addEventListener("input", renderSearchResults);
els.fmSearch.addEventListener("input", renderFilesModal);

/* ---------- служебные ---------- */
function clearSearch(){
  els.search.value = "";
  renderSearchResults();
}

let toastTimer = null;
function toast(s){
  els.toast.innerHTML = String(s).split("\n").map((line, i) =>
    i === 0 ? "<b>" + esc(line) + "</b>" : esc(line)
  ).join("<br>");
  els.toast.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { els.toast.style.display = "none"; }, 2600);
}

/* ---------- старт ---------- */
try {
  render();
} catch (err){
  console.error(err);
  if (els.errbox){
    els.errbox.className = "errbox";
    els.errbox.textContent =
      "Ошибка в данных сайта:\n" + (err && err.message ? err.message : String(err)) +
      "\n\nПроверьте массивы FILES и VIDEOS — чаще всего это пропущенная запятая.";
  }
}
